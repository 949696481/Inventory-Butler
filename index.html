<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161B33">
<title>库存管家</title>
<style>
  :root {
    --bg-deep: #161B33;
    --bg-light: #2B3566;
    --gold-light: #E0C084;
    --gold-dark: #A67B3D;
    --paper: #F5F3EE;
    --paper-dim: #EAE6DC;
    --ink: #1E2233;
    --ink-dim: #5B5F70;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg-deep);
    background-image: radial-gradient(circle at 20% 0%, var(--bg-light) 0%, transparent 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    max-width: 400px;
    width: 100%;
    background: var(--paper);
    border-radius: 24px;
    padding: 44px 32px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  .mark {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    overflow: hidden;
    margin: 0 auto 22px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  }
  .mark img { width: 100%; height: 100%; display: block; object-fit: cover; }
  h1 {
    margin: 0 0 8px;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: 0.5px;
  }
  p.tagline {
    margin: 0 0 28px;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .cta {
    display: block;
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: var(--bg-deep);
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
    text-align: center;
  }
  .hint {
    margin: 14px 0 0;
    font-size: 11px;
    color: var(--ink-dim);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"><img src="icon-512.png" alt="库存管家"></div>
    <h1>库存管家</h1>
    <p class="tagline">库存登记 · 消耗计算 · 门店管理</p>
    <a class="cta" href="app/">进入库存管家 →</a>
    <p class="hint">打开后可点浏览器菜单"添加到主屏幕"，像 App 一样使用</p>
  </div>
  <script>
    // 早期版本曾经在根目录注册过 service worker,清一下残留注册/缓存,避免
    // 旧版本一直挡在新内容前面(见 sw.js 里的说明)。
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
    if ("caches" in window) {
      caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
    }
  </script>
</body>
</html>
